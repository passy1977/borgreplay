# /etc/borgreplay/cycle.conf - overrides the defaults of borgreplay-cycle
#
# Uncomment and change only what you need.

#WAKE_TIME="02:00"                          # local time of the daily wake-up
#POOL="backup"                              # ZFS pool
#SYNC_MARKER="/backup/borgrepo/.last_sync"  # file touched when the replica ends
#SYNC_WAIT_MIN=180                          # maximum wait for the replica (minutes)
#SCRUB_EVERY_DAYS=30                        # interval between two scrubs
#REPORT_DOW=1                               # day of the full report (1 = Monday)
